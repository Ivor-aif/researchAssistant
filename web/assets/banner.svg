<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="white" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="300" fill="url(#bg)"/>
  <rect width="800" height="300" fill="url(#grid)"/>
  
  <!-- Abstract Nodes -->
  <circle cx="100" cy="100" r="4" fill="white" opacity="0.2"/>
  <circle cx="150" cy="200" r="6" fill="white" opacity="0.2"/>
  <circle cx="700" cy="80" r="8" fill="white" opacity="0.2"/>
  <circle cx="650" cy="220" r="5" fill="white" opacity="0.2"/>
  <line x1="100" y1="100" x2="150" y2="200" stroke="white" stroke-opacity="0.1" stroke-width="2"/>
  <line x1="700" y1="80" x2="650" y2="220" stroke="white" stroke-opacity="0.1" stroke-width="2"/>
  
  <!-- Main Text -->
  <text x="400" y="140" font-family="Arial, sans-serif" font-weight="bold" font-size="64" fill="white" text-anchor="middle">Research Assistant</text>
  
  <!-- Subtitle -->
  <text x="400" y="200" font-family="Arial, sans-serif" font-size="24" fill="#e0e7ff" text-anchor="middle">Manage Projects • Track Directions • AI Powered</text>
  
  <!-- Decorative Icon (Magnifying Glass stylized) -->
  <g transform="translate(680, 20) scale(1)" opacity="0.1">
      <path d="M42 42 L52 52" stroke="white" stroke-width="6" stroke-linecap="round"/>
      <circle cx="28" cy="28" r="14" stroke="white" stroke-width="4" fill="none"/>
  </g>
</svg>